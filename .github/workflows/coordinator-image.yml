name: Build server images
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/coordinator-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/daviied/rd-coordinator:latest
      - uses: docker/build-push-action@v6
        with:
          context: server/power
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/daviied/rd-power:latest
