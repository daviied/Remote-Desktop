name: Build host and client tools
on:
  push:
    branches: [main]
    paths: ["host/**", "client/**", ".github/workflows/host-tools.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rd-hostd:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build rd-hostd.exe
        shell: msys2 {0}
        run: g++ -std=c++20 -O2 -municode -static -o rd-hostd.exe host/rd-hostd/rd-hostd.cpp -luser32 -lgdi32 -lshell32
      - uses: actions/upload-artifact@v4
        with:
          name: rd-hostd
          path: rd-hostd.exe
